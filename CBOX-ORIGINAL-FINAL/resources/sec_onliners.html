try {
	var cbf = window.opener;
	cbf.aonliners(0);
} catch (e) {};

function pmquote (uid) {
	if (!cbf) {
		return;
	}
	
	var cd = cbf.document;
	var inp = cd.forms[0].pst;
	
	if (inp.value == cbf.t3) {
		inp.value = "";
	}
	inp.value = "//pm "+uid+" "+inp.value;

	var caret = inp.value.length;

	if (cd.selection) {
		var sel = cd.selection.createRange();
		sel.moveEnd ('character', caret);
		sel.moveStart ('character', caret);
		sel.select();
	}
	else if (inp.selectionStart != "null") {
		inp.selectionStart = caret;
		inp.selectionEnd = caret;
	}
	
	inp.focus();
	window.blur();
}

</script>
