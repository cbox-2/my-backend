<!DOCTYPE html><html dir="rtl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, user-scalable=no"><meta http-equiv="X-UA-Compatible" content="IE=edge"><link href="data:image/x-icon;base64,AAABAAEAEBACAAAAAACwAAAAFgAAACgAAAAQAAAAIAAAAAEAAQAAAAAAQAAAAAAAAAAAAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA" rel="icon" type="image/x-icon"><title>Cbox</title><style type="text/css">@import "./?boxid=4271419&boxtag=do3gdi&sec=css&i=1431386153";</style><script>
var onkey = false;
var cbf = window.opener;
function smilie(txt) {
	if (!cbf) {
		return;
	}
	
	var cd = cbf.document;
	var ln = cd.forms[0].pst;

	if (ln.value == cbf.t3) ln.value = "";
	ln.focus();

	if (cd.selection) {
		sel = cd.selection.createRange();
		c = "\001";
		if (sel.text != null) sel.text = c;
		end = start = ln.value.indexOf(c);
		if (end == -1) end = start = ln.value.length;
		sel.moveStart('character',-1);
		sel.text = "";
	}
	else if (ln.selectionStart != "null") {
		start = ln.selectionStart;
		end = ln.selectionEnd;
	}

	var spce = (ln.value.charAt(end) == " ")?true:false;
	var txt = ((start == 0 || ln.value.charAt(start-1) == " ")?"":" ")+txt;
	txt = txt+((spce)?"":" ");

	ln.value = ln.value.substring(0, start)+txt+ln.value.substring(end);

	var caret = start + txt.length + ((spce)?1:0);

	if (cd.selection) {
		sel.moveEnd ('character', -ln.value.length);
		sel.moveEnd ('character', caret);
		sel.moveStart ('character', caret);
		sel.select();
	}
	else if (ln.selectionStart != "null") {
		ln.selectionStart = caret;
		ln.selectionEnd = caret;
	}

	if (onkey) window.focus();
	else window.close();
}

function getkey(e) {
	if (!e) var e = window.event;
	onkey = (e.shiftKey) ? true : false;
}

</script>
