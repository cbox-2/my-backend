name: Extract TAR.GZ

on:
  push:
    paths:
      - 'CBOX-ORIGINAL-FINAL.tar.gz'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Extract TAR.GZ
        run: |
          tar -xzf CBOX-ORIGINAL-FINAL.tar.gz
          rm CBOX-ORIGINAL-FINAL.tar.gz
          
      - name: Commit extracted files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Extract original system files" || echo "No changes"
          git push
